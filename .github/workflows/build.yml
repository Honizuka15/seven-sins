# Fabrication automatique à chaque mise à jour du code :
#  1. l'application Android (.apk) → onglet "Releases" du dépôt GitHub
#  2. la version web (PC / iPhone / lien à partager) → GitHub Pages
# Les fichiers peuvent être envoyés en vrac à la racine du dépôt : l'étape « Ranger les fichiers » les remet à leur place.
name: Fabriquer l'application

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Ranger les fichiers
        run: |
          set -e
          mv_if() { if [ -f "$1" ]; then mkdir -p "$(dirname "$2")"; mv "$1" "$2"; fi; }
          mv_if app.js src/app.js; mv_if store.js src/store.js; mv_if main.js src/main.js; mv_if style.css src/style.css
          mv_if questions.js src/data/questions.js; mv_if questions_extra.js src/data/questions_extra.js; mv_if sins.js src/data/sins.js
          mv_if scoring.js src/engine/scoring.js; mv_if analysis.js src/engine/analysis.js; mv_if achievements.js src/engine/achievements.js
          mv_if cards.js src/ui/cards.js; mv_if radar.js src/ui/radar.js
          mv_if sw.js public/sw.js; mv_if manifest.webmanifest public/manifest.webmanifest
          mv_if icon-192.png public/icon-192.png; mv_if icon-512.png public/icon-512.png
          mv_if icon-maskable-512.png public/icon-maskable-512.png; mv_if apple-touch-icon.png public/apple-touch-icon.png
          mv_if icon-only.png assets/icon-only.png; mv_if icon-foreground.png assets/icon-foreground.png; mv_if icon-background.png assets/icon-background.png
          mv_if splash-dark.png assets/splash-dark.png
          [ -f assets/splash.png ] || cp assets/splash-dark.png assets/splash.png
          mv_if sevensins-release.jks keys/sevensins-release.jks
          ls -R src public assets
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - name: Créer le projet Android
        run: |
          set -e
          if [ ! -d android ]; then npx cap add android; fi
          npx capacitor-assets generate --android --iconBackgroundColor '#0b0a0d' --iconBackgroundColorDark '#0b0a0d' --splashBackgroundColor '#0b0a0d' --splashBackgroundColorDark '#0b0a0d'
          npx cap sync android
          if [ -f keys/sevensins-release.jks ]; then cp keys/sevensins-release.jks android/app/sevensins-release.jks; fi
          python3 - <<'PY'
          p = 'android/app/build.gradle'
          s = open(p).read()
          if 'signingConfigs' not in s:
              s = s.replace('versionCode 1', 'versionCode((System.getenv("VERSION_CODE") ?: "1").toInteger())')
              s = s.replace('versionName "1.0"', 'versionName "1." + (System.getenv("VERSION_CODE") ?: "0")')
              s = s.replace('    buildTypes {\n        release {\n            minifyEnabled false',
                '    signingConfigs {\n        sevensins {\n            storeFile file("sevensins-release.jks")\n            storePassword "ss-517bcb46f7a8a1c6"\n            keyAlias "sevensins"\n            keyPassword "ss-517bcb46f7a8a1c6"\n        }\n    }\n    buildTypes {\n        debug { signingConfig signingConfigs.sevensins }\n        release {\n            signingConfig signingConfigs.sevensins\n            minifyEnabled false')
              open(p, 'w').write(s)
          PY
      - name: Compiler l'APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../SevenSins.apk
      - name: Publier l'APK (onglet Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Seven Sins v1.${{ github.run_number }}
          body: "Télécharge **SevenSins.apk** sur ton téléphone Android, puis ouvre-le pour installer ou mettre à jour."
          files: SevenSins.apk
          make_latest: true

  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Ranger les fichiers
        run: |
          set -e
          mv_if() { if [ -f "$1" ]; then mkdir -p "$(dirname "$2")"; mv "$1" "$2"; fi; }
          mv_if app.js src/app.js; mv_if store.js src/store.js; mv_if main.js src/main.js; mv_if style.css src/style.css
          mv_if questions.js src/data/questions.js; mv_if questions_extra.js src/data/questions_extra.js; mv_if sins.js src/data/sins.js
          mv_if scoring.js src/engine/scoring.js; mv_if analysis.js src/engine/analysis.js; mv_if achievements.js src/engine/achievements.js
          mv_if cards.js src/ui/cards.js; mv_if radar.js src/ui/radar.js
          mv_if sw.js public/sw.js; mv_if manifest.webmanifest public/manifest.webmanifest
          mv_if icon-192.png public/icon-192.png; mv_if icon-512.png public/icon-512.png
          mv_if icon-maskable-512.png public/icon-maskable-512.png; mv_if apple-touch-icon.png public/apple-touch-icon.png
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
